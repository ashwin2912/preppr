name = "preppr-cutoff"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Every 5 min, 9:00-14:55 New York time. Cron runs in UTC, so 13-19 covers
# both EDT (UTC-4) and EST (UTC-5); the extra hour is harmless.
[triggers]
crons = ["*/5 13-19 * * *"]

[vars]
PUBLIC_URL = "https://wa.ashwindhanasamy.com"   # same as PUBLIC_URL in the app's .env

# Secret (not in this file): npx wrangler secret put JOB_SECRET
